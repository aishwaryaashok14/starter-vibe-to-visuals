<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Three-beat video starter</title>
  <style>
    :root{--paper:#f5eddd;--ink:#2b241a;--accent:#315e82}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#181511;font-family:Arial,sans-serif}.phone{position:relative;width:min(430px,100vw);aspect-ratio:9/16;overflow:hidden;background:var(--paper);color:var(--ink)}.scene{position:absolute;inset:0;display:grid;place-items:center;opacity:0;animation:scene 8s infinite}.scene img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:push 8s infinite}.scene h1{position:relative;z-index:1;margin:0 34px;padding:16px 18px;background:#f5eddddf;font:700 44px/1 Georgia,serif;text-align:center}.s1{animation-delay:0s}.s2{animation-delay:2.5s}.s3{animation-delay:5.2s}.s1 img{animation-delay:0s}.s2 img{animation-delay:2.5s}.s3 img{animation-delay:5.2s}@keyframes scene{0%{opacity:0}5%,30%{opacity:1}35%,100%{opacity:0}}@keyframes push{0%{transform:scale(1)}35%{transform:scale(1.08)}100%{transform:scale(1.08)}}.hint{position:fixed;bottom:12px;color:#fff;font-size:14px;opacity:.8}
  </style>
</head>
<body>
  <main class="phone" aria-label="Looping three-scene vertical video preview">
    <section class="scene s1"><img src="../assets/soft-hours-social.png" alt="Replace with the hook image"><h1>The evening begins</h1></section>
    <section class="scene s2"><img src="../assets/soft-hours-product-family.png" alt="Replace with the product image"><h1>Cobalt Lid Candle<br>₹1,450</h1></section>
    <section class="scene s3"><img src="../assets/soft-hours-product-family.png" alt="Replace with the collection image"><h1>Small objects for a slower evening</h1></section>
  </main>
  <div class="hint">Replace the three images and lines. Record one 8-second loop or use the same scenes in your editor.</div>
</body>
</html>
